name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh snapshot da vitrine (fallback caso API caia em runtime)
        run: node scripts/refresh-vitrine.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: pro105.dnspro.com.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # server-dir: '/' = raiz do home (/home/allaserc/), servido pelo
          # subdominio novo.allaser.com.br. Ate a migracao definitiva ser
          # feita via suporte Napoleon (troca de Document Root do dominio
          # principal), o WordPress continua no ar em /public_html/ como
          # esta desde sempre.
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            CLAUDE.md

# Job deploy-lps removido: as LPs são publicadas manualmente (decisão do time).
# Ele rodava em paralelo conectando no mesmo FTP da Napoleon e estourava o
# limite de conexões simultâneas, derrubando o deploy principal de forma
# intermitente. Com um job só, o deploy deixa de competir consigo mesmo.
