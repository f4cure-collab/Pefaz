name: Deploy via FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Refresh snapshot da vitrine (fallback caso API caia em runtime)
        run: node scripts/refresh-vitrine.js

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: pro133.dnspro.com.br
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Servidor migrado pela Napoleon em 13/09/2026: pro105 -> pro133.
          # O usuario FTP deploy@allaser.com.br e chrootado em /public_html/,
          # que e o Document Root do dominio principal. Por isso server-dir: /
          # aqui ja significa a raiz publicada do site.
          server-dir: /
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            CLAUDE.md

# Job deploy-lps removido: as LPs são publicadas manualmente (decisão do time).
# Ele rodava em paralelo conectando no mesmo FTP da Napoleon e estourava o
# limite de conexões simultâneas, derrubando o deploy principal de forma
# intermitente. Com um job só, o deploy deixa de competir consigo mesmo.
