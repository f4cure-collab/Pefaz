name: Migrate site (WP → novo)

# One-shot workflow disparado manualmente pela UI do GitHub Actions.
# CONTEXTO da migração (confirmado via diagnose 2026-08-13):
#   - Site novo já esta na raiz do FTP (/home/allaserc/)
#   - WordPress esta em /home/allaserc/public_html/
#   - allaser.com.br tem Document Root = /public_html/ (fixo no cPanel)
# ESTRATEGIA: renomear /public_html/ (WP) para /wp_backup/, e depois
# apontar o deploy do site novo para /public_html/ (via deploy.yml). Zero
# movimentacao de arquivos, so 1 rename.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose = so lista, nao muda nada. swap = renomeia public_html → wp_backup. revert = desfaz o swap.'
        required: true
        default: 'diagnose'
        type: choice
        options:
          - diagnose
          - swap
          - revert

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run FTP operation
        env:
          FTP_SERVER: pro105.dnspro.com.br
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          MODE: ${{ inputs.mode }}
        run: |
          python3 <<'PYEOF'
          import os, sys
          from ftplib import FTP, error_perm

          host = os.environ['FTP_SERVER']
          user = os.environ['FTP_USERNAME']
          pw   = os.environ['FTP_PASSWORD']
          mode = os.environ['MODE']

          print(f"═══ Conectando em {host} como {user} ═══")
          ftp = FTP(host, timeout=30)
          ftp.login(user, pw)
          print(f"PWD apos login: {ftp.pwd()}")

          # 1) Confirma que ambos os alvos existem/nao existem conforme esperado
          print("\n═══ Estado atual das pastas ═══")
          state = {}
          for folder in ['public_html', 'wp_backup']:
              try:
                  ftp.cwd(folder)
                  state[folder] = True
                  print(f"  ✓ /{folder} existe")
                  ftp.cwd('..')
              except error_perm:
                  state[folder] = False
                  print(f"  ✗ /{folder} nao existe")

          # 2) Executa a acao escolhida
          if mode == 'diagnose':
              print("\n═══ MODO DIAGNOSE — nada foi alterado ═══")
              # Da uma dica do que o swap faria
              if state['public_html'] and not state['wp_backup']:
                  print("Estado: PRE-swap (WP em public_html). Pronto para rodar 'swap'.")
              elif not state['public_html'] and state['wp_backup']:
                  print("Estado: POS-swap (WP renomeado). Ja executou o swap.")
                  print("Para reverter, rode com mode=revert.")
              elif state['public_html'] and state['wp_backup']:
                  print("⚠ AMBAS pastas existem. Precisa decidir manualmente antes de swap.")
              else:
                  print("⚠ NENHUMA pasta existe. Estado inesperado.")

          elif mode == 'swap':
              print("\n═══ MODO SWAP — renomeando /public_html/ → /wp_backup/ ═══")
              if not state['public_html']:
                  print("  ✗ /public_html/ nao existe. Nada a fazer.")
                  sys.exit(1)
              if state['wp_backup']:
                  print("  ✗ /wp_backup/ ja existe. Aborte para nao sobrescrever.")
                  sys.exit(1)
              try:
                  ftp.rename('public_html', 'wp_backup')
                  print("  ✓ public_html → wp_backup OK")
                  print("\n═══ SWAP CONCLUIDO ═══")
                  print("WordPress preservado em /wp_backup/.")
                  print("Agora /public_html/ NAO EXISTE — allaser.com.br vai dar 404 ate")
                  print("o proximo deploy popular /public_html/ com o site novo.")
                  print("\n>>> PROXIMO PASSO: rode o workflow 'Deploy via FTP' manualmente")
                  print(">>> ou faça um push qualquer para disparar o deploy automatico.")
              except error_perm as e:
                  print(f"  ✗ FALHOU rename: {e}")
                  print("  Nada foi alterado. Verifique permissoes.")
                  sys.exit(1)

          elif mode == 'revert':
              print("\n═══ MODO REVERT — desfazendo swap ═══")
              if not state['wp_backup']:
                  print("  ✗ /wp_backup/ nao existe. Nada a reverter.")
                  sys.exit(1)
              if state['public_html']:
                  print("  ⚠ /public_html/ existe (site novo ja foi deployado la).")
                  print("  Renomeando para /public_html_novo/ antes de restaurar WP.")
                  try:
                      ftp.rename('public_html', 'public_html_novo')
                      print("  ✓ public_html → public_html_novo OK")
                  except error_perm as e:
                      print(f"  ✗ FALHOU: {e}")
                      sys.exit(1)
              try:
                  ftp.rename('wp_backup', 'public_html')
                  print("  ✓ wp_backup → public_html OK")
                  print("\n═══ REVERT CONCLUIDO — WordPress de volta no ar ═══")
              except error_perm as e:
                  print(f"  ✗ FALHOU: {e}")
                  print("  ATENCAO: estado inconsistente.")
                  sys.exit(1)

          ftp.quit()
          print("\n═══ Fim ═══")
          PYEOF
